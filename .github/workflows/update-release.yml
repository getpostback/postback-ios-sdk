name: Publish CocoaPods

# The private iOS release workflow is the sole owner of this repository's
# metadata, tag, and GitHub Release asset. This workflow verifies that immutable
# public release, then publishes the matching podspec to CocoaPods.
on:
  repository_dispatch:
    types: [ios-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true

concurrency:
  group: ios-public-release-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version from dispatch
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RAW_VERSION="${DISPATCH_VERSION}"
          else
            RAW_VERSION="${INPUT_VERSION}"
          fi
          VERSION="${RAW_VERSION#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${RAW_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/getpostback/postback-ios-sdk/releases/download/v${VERSION}/PostbackSDK.xcframework.zip" >> "$GITHUB_OUTPUT"

      - name: Download XCFramework and compute checksum
        id: checksum
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-delay 5 -o PostbackSDK.xcframework.zip "${{ steps.version.outputs.url }}"
          unzip -t PostbackSDK.xcframework.zip >/dev/null
          TMP_DIR="$(mktemp -d)"
          unzip -q PostbackSDK.xcframework.zip -d "$TMP_DIR"

          DEVICE_BINARY="$TMP_DIR/PostbackSDK.xcframework/ios-arm64/PostbackSDK.framework/PostbackSDK"
          DEVICE_DSYM="$TMP_DIR/PostbackSDK.xcframework/ios-arm64/dSYMs/PostbackSDK.framework.dSYM"
          SIM_BINARY="$TMP_DIR/PostbackSDK.xcframework/ios-arm64_x86_64-simulator/PostbackSDK.framework/PostbackSDK"
          SIM_DSYM="$TMP_DIR/PostbackSDK.xcframework/ios-arm64_x86_64-simulator/dSYMs/PostbackSDK.framework.dSYM"

          for REQUIRED_PATH in \
            "$DEVICE_BINARY" \
            "$DEVICE_DSYM/Contents/Resources/DWARF/PostbackSDK" \
            "$SIM_BINARY" \
            "$SIM_DSYM/Contents/Resources/DWARF/PostbackSDK"
          do
            test -e "$REQUIRED_PATH"
          done

          verify_dsym_uuids() {
            local binary="$1"
            local dsym="$2"
            local label="$3"
            local missing

            missing="$(comm -23 \
              <(dwarfdump --uuid "$binary" | awk '{ print $2 }' | sort -u) \
              <(dwarfdump --uuid "$dsym" | awk '{ print $2 }' | sort -u))"

            if [ -n "$missing" ]; then
              echo "Missing $label dSYM UUID(s): $missing"
              exit 1
            fi
          }

          verify_dsym_uuids "$DEVICE_BINARY" "$DEVICE_DSYM" "device"
          verify_dsym_uuids "$SIM_BINARY" "$SIM_DSYM" "simulator"
          CHECKSUM=$(swift package compute-checksum PostbackSDK.xcframework.zip)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Verify immutable public release
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          VERSION="${{ steps.version.outputs.version }}"
          ASSET_URL="${{ steps.version.outputs.url }}"

          git fetch --quiet origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --quiet --detach "${RELEASE_TAG}"

          grep -Fq "url: \"${ASSET_URL}\"" Package.swift
          grep -Fq "checksum: \"${CHECKSUM}\"" Package.swift
          grep -Fq "s.version          = '${VERSION}'" PostbackSDK.podspec
          grep -Fq "from: \"${VERSION}\"" README.md
          grep -Fq "from \`${VERSION}\`" README.md
          grep -Fq "~> ${VERSION}" README.md

          RELEASE_TAG_NAME="$(gh release view "${RELEASE_TAG}" --json tagName --jq '.tagName')"
          RELEASE_IS_DRAFT="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "${RELEASE_TAG_NAME}" != "${RELEASE_TAG}" ] || [ "${RELEASE_IS_DRAFT}" != "false" ]; then
            echo "Unexpected GitHub Release state: tag=${RELEASE_TAG_NAME}, draft=${RELEASE_IS_DRAFT}" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CocoaPods
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          if pod trunk info PostbackSDK 2>/dev/null | grep -Fq -- "- ${VERSION} ("; then
            echo "PostbackSDK ${VERSION} is already published"
            exit 0
          fi

          if pod trunk push PostbackSDK.podspec --allow-warnings --skip-import-validation --skip-tests; then
            exit 0
          fi

          # CocoaPods can accept a spec and still return an internal server
          # error. Re-check trunk before treating the release as failed.
          sleep 5
          pod trunk info PostbackSDK | grep -Fq -- "- ${VERSION} ("
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
